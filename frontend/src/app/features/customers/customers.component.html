<!-- Teal Header Bar -->
<div class="amcu-header no-print">
  <button class="back-btn" type="button" (click)="goBack()">
    <i class="bi bi-arrow-left"></i>
  </button>
  
  <div class="title-wrap" style="color: white;">
    <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0;">Customers</h1>
    <p style="font-size: 0.75rem; margin: 0; opacity: 0.9; text-transform: uppercase; font-weight: 600;">{{ dairyName }}</p>
  </div>
  
  <div class="header-actions d-flex align-items-center gap-3">
    <button class="btn btn-link p-0 text-white" type="button" (click)="openAdd()" title="Add Customer">
      <i class="bi bi-plus-lg" style="font-size: 1.3rem;"></i>
    </button>
    <i class="bi bi-three-dots-vertical"></i>
  </div>
</div>

<!-- Search Bar -->
<div class="no-print" style="padding: 12px 16px; background-color: #ffffff; border-bottom: 1px solid #e0e0e0;">
  <input 
    type="text" 
    class="form-control" 
    placeholder="Type code, mobile, name" 
    [(ngModel)]="searchTerm" 
    style="background-color: #f5f5f5; border: none; border-radius: 4px; padding: 8px 12px; font-size: 0.95rem; outline: none; box-shadow: none; width: 100%;"
  />
</div>

<div class="success-toast" *ngIf="msg">
  <span class="check"><i class="bi bi-check-lg"></i></span>
  <span>{{ msg }}</span>
</div>

<div class="list-stack" *ngIf="loading">
  <div class="skeleton skeleton-card" *ngFor="let i of [1, 2, 3]"></div>
</div>

<div class="empty-state py-5" *ngIf="!loading && !filteredCustomers.length">
  <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
  <h4>No Farmers Found</h4>
  <button class="btn btn-dairy mt-2" type="button" (click)="openAdd()">
    <i class="bi bi-person-plus-fill"></i> Add New Farmer
  </button>
</div>

<!-- Customers list log -->
<div class="list-stack" *ngIf="!loading && filteredCustomers.length" style="background-color: #ffffff; margin: 0;">
  <article class="list-item" *ngFor="let c of filteredCustomers" style="display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e0e0e0;">
    <!-- Circular avatar with index code -->
    <div class="avatar" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #2f9f95; background-color: white; color: #2f9f95; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 500; flex-shrink: 0; margin-right: 16px;">
      {{ c.farmerCode || '0' }}
    </div>
    
    <div class="list-item-body" style="flex: 1;">
      <h3 class="list-item-title" style="font-size: 1.05rem; font-weight: 500; color: #333333; margin: 0 0 2px 0; font-family: sans-serif;">{{ c.name }}</h3>
      <p class="list-item-sub" style="font-size: 0.8rem; color: #888888; margin: 0;">{{ c.mobile }}</p>
    </div>
    
    <div class="d-flex align-items-center gap-3">
      <!-- Edit trigger -->
      <button class="btn btn-link p-0 text-secondary" type="button" (click)="edit(c)" aria-label="Edit farmer" title="Edit Profile">
        <i class="bi bi-pencil" style="font-size: 1.1rem; color: #7f8c8d;"></i>
      </button>
      <!-- Delete trigger -->
      <button class="btn btn-link p-0 text-secondary" type="button" (click)="remove(c.id)" aria-label="Delete farmer" title="Delete Profile">
        <i class="bi bi-trash" style="font-size: 1.1rem; color: #e74c3c;"></i>
      </button>
      <!-- Phone Call trigger -->
      <a href="tel:{{ c.mobile }}" class="btn btn-link p-0 text-dark d-flex align-items-center justify-content-center" style="text-decoration: none;" title="Call Farmer">
        <i class="bi bi-telephone-fill" style="font-size: 1.2rem; color: #333333;"></i>
      </a>
    </div>
  </article>
</div>

<div class="modal-sheet no-print" *ngIf="showForm" (click)="closeForm()">
  <div class="modal-sheet-card" (click)="$event.stopPropagation()">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h2 class="section-title mb-0">{{ editingId ? translation.t('edit_farmer') : translation.t('register_farmer') }}</h2>
      <button class="btn btn-sm btn-light btn-icon" type="button" (click)="closeForm()" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    
    <!-- Backend Error Alert -->
    <div class="alert alert-danger py-2 mb-3" *ngIf="errorMsg">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMsg }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="small">
      
      <div class="row g-2 mb-2">
        <div class="col-4">
          <label class="form-label">{{ translation.t('farmer_code') }}</label>
          <input class="form-control" placeholder="Auto" formControlName="farmerCode" />
        </div>
        <div class="col-8">
          <label class="form-label">{{ translation.t('full_name') }} <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="Farmer's name" formControlName="name" />
          <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="text-danger small mt-1">
            Name is required.
          </div>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="form-label">{{ translation.t('mobile_no') }} <span class="text-danger">*</span></label>
          <input class="form-control" placeholder="10-digit mobile" formControlName="mobile" />
          <div *ngIf="form.get('mobile')?.touched && form.get('mobile')?.invalid" class="text-danger small mt-1">
            Valid 10-15 digit mobile is required.
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">{{ translation.t('village') }}</label>
          <input class="form-control" placeholder="Village" formControlName="village" />
        </div>
      </div>

      <label class="form-label">{{ translation.t('address') }}</label>
      <input class="form-control mb-2" placeholder="Address" formControlName="address" />

      <label class="form-label">{{ translation.t('bank_details') }}</label>
      <textarea class="form-control mb-2" rows="2" placeholder="Bank Name, Account, IFSC" formControlName="bankDetails"></textarea>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">{{ translation.t('default_cat') }}</label>
          <select class="form-select" formControlName="defaultAnimalType">
            <option value="cow">Cow (गाय)</option>
            <option value="buffalo">Buffalo (म्हैस)</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">{{ translation.t('status') }}</label>
          <select class="form-select" formControlName="status">
            <option value="active">{{ translation.t('active') }}</option>
            <option value="inactive">{{ translation.t('inactive') }}</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ translation.t('joining_date') }}</label>
        <input class="form-control" type="date" formControlName="joiningDate" />
      </div>

      <button class="btn btn-dairy btn-full py-2 fs-6 mt-2" type="submit">
        <i class="bi bi-check2-circle me-1"></i>
        {{ editingId ? translation.t('save') : translation.t('register_farmer') }}
      </button>
    </form>
  </div>
</div>
