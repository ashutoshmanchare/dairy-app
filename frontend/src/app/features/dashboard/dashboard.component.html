<!-- Top Brand Header Bar -->
<div class="home-brand-header no-print">
  <!-- Exact SVG replication of the mobile dairy brand logo -->
  <div style="display: inline-flex; align-items: center; height: 32px;">
    <svg width="135" height="28" viewBox="0 0 135 28" xmlns="http://www.w3.org/2000/svg">
      <text x="2" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16.5" fill="#2d2d74" letter-spacing="-0.03em">mobile</text>
      <text x="56" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16.5" fill="#319f96" letter-spacing="-0.03em">dairy</text>
      <path d="M 58 23 Q 92 31 126 23" fill="none" stroke="#319f96" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="d-flex align-items-center gap-2">
    <!-- Language Switcher -->
    <button class="btn btn-sm lang-toggle-btn d-flex align-items-center gap-1 shadow-sm" type="button" (click)="translation.toggleLanguage()">
      <i class="bi bi-translate text-teal"></i> 
      <span>{{ translation.currentLanguage === 'en' ? 'मराठी' : 'ENG' }}</span>
    </button>

    <button class="home-settings-link ms-1" routerLink="/more" style="color: #2d2d74; font-weight: 700;">
      <span>Settings</span>
      <i class="bi bi-gear" style="color: #2d2d74; font-size: 1.15rem;"></i>
    </button>
  </div>
</div>

<!-- Main Overlapping Card Wrapper -->
<div class="home-overlapping-card">
  <!-- Route Details Header -->
  <div class="home-route-title">Mobile Dairy</div>
  <div class="home-route-subtitle">[ROUTE 01] Dewale, Mahabaleshwar, Satara, 412806</div>
  
  <!-- 3-Column Circular Modules Grid -->
  <div class="amcu-home-grid">
    <!-- 1. Collection -->
    <a class="amcu-home-module" routerLink="/milk">
      <div class="amcu-circle-icon"><i class="bi bi-droplet-fill"></i></div>
      <span class="amcu-circle-label">Collection</span>
    </a>
    
    <!-- 2. Customer -->
    <a class="amcu-home-module" routerLink="/customers">
      <div class="amcu-circle-icon"><i class="bi bi-people-fill"></i></div>
      <span class="amcu-circle-label">Customer</span>
    </a>

    <!-- 3. Food -->
    <a class="amcu-home-module" routerLink="/feed">
      <div class="amcu-circle-icon"><i class="bi bi-bag-check-fill"></i></div>
      <span class="amcu-circle-label">Food</span>
    </a>

    <!-- 4. Advance -->
    <a class="amcu-home-module" routerLink="/advance">
      <div class="amcu-circle-icon"><i class="bi bi-cash-coin"></i></div>
      <span class="amcu-circle-label">Advance</span>
    </a>

    <!-- 5. Deduction -->
    <a class="amcu-home-module" routerLink="/deduction">
      <div class="amcu-circle-icon"><i class="bi bi-percent"></i></div>
      <span class="amcu-circle-label">Deduction</span>
    </a>

    <!-- 6. Invoice -->
    <a class="amcu-home-module" routerLink="/invoice">
      <div class="amcu-circle-icon"><i class="bi bi-file-earmark-text-fill"></i></div>
      <span class="amcu-circle-label">Invoice</span>
    </a>

    <!-- 7. Milk Sale -->
    <a class="amcu-home-module" routerLink="/milk-sale">
      <div class="amcu-circle-icon"><i class="bi bi-cup-straw"></i></div>
      <span class="amcu-circle-label">Milk Sale</span>
    </a>

    <!-- 8. Dairy Expense -->
    <a class="amcu-home-module" routerLink="/expense">
      <div class="amcu-circle-icon"><i class="bi bi-calculator-fill"></i></div>
      <span class="amcu-circle-label">Dairy Expense</span>
    </a>

    <!-- 9. Rate Chart -->
    <a class="amcu-home-module" routerLink="/rate-chart">
      <div class="amcu-circle-icon"><i class="bi bi-grid-3x3-gap-fill"></i></div>
      <span class="amcu-circle-label">Rate Chart</span>
    </a>

    <!-- 10. Reports -->
    <a class="amcu-home-module" routerLink="/reports">
      <div class="amcu-circle-icon"><i class="bi bi-graph-up-arrow"></i></div>
      <span class="amcu-circle-label">Reports</span>
    </a>

    <!-- 11. Notice Board -->
    <a class="amcu-home-module" routerLink="/notice">
      <div class="amcu-circle-icon"><i class="bi bi-clipboard-check-fill"></i></div>
      <span class="amcu-circle-label">Notice Board</span>
    </a>

    <!-- 12. Annual Bonus -->
    <a class="amcu-home-module" routerLink="/bonus">
      <div class="amcu-circle-icon"><i class="bi bi-gift-fill"></i></div>
      <span class="amcu-circle-label">Annual Bonus</span>
    </a>

    <!-- 13. Milk Dispatch -->
    <a class="amcu-home-module" routerLink="/dispatch">
      <div class="amcu-circle-icon"><i class="bi bi-truck"></i></div>
      <span class="amcu-circle-label">Milk Dispatch</span>
    </a>

    <!-- 14. Milk Received -->
    <a class="amcu-home-module" routerLink="/receive">
      <div class="amcu-circle-icon"><i class="bi bi-truck-flatbed"></i></div>
      <span class="amcu-circle-label">Milk Received</span>
    </a>
  </div>
</div>

<!-- Bottom Status Refresh Footer -->
<div class="home-footer-status no-print">
  <span>Last Refresh: {{ lastRefreshTime }}</span>
  <button type="button" class="refresh-btn" (click)="refreshData()">
    <span>Refresh</span>
    <i class="bi bi-arrow-clockwise" [class.fa-spin]="loading"></i>
  </button>
</div>
