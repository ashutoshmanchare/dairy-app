<section class="card glass-card p-4">
  <h3 class="fw-bold">{{ currentId ? "Edit Entry" : "Add New Diary Entry" }}</h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="form-label">Title</label>
    <input class="form-control" type="text" formControlName="title" />

    <label class="form-label mt-2">Description</label>
    <textarea class="form-control" rows="4" formControlName="content"></textarea>

    <label class="form-label mt-2">Date</label>
    <input class="form-control" type="date" formControlName="entryDate" />

    <label class="form-label mt-2">Mood</label>
    <select class="form-select" formControlName="mood">
      <option value="happy">Happy</option>
      <option value="neutral">Neutral</option>
      <option value="sad">Sad</option>
    </select>

    <label class="form-label mt-2">Tags (comma separated)</label>
    <input class="form-control" type="text" formControlName="tags" />

    <button class="btn btn-primary mt-3" type="submit">
      {{ currentId ? "Update Entry" : "Add Entry" }}
    </button>
  </form>
</section>
